name: Build Mobile

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        type: choice
        options:
          - all
          - ios
          - android
        default: all
      auto_submit:
        description: "Submit the build to the App Store / Play Store afterward"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-mobile-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build
        working-directory: apps/mobile
        run: eas build --platform "${{ inputs.platform }}" --profile production --non-interactive

      - name: Submit to app stores
        if: ${{ inputs.auto_submit == true }}
        working-directory: apps/mobile
        run: eas submit --platform "${{ inputs.platform }}" --profile production --non-interactive --latest
