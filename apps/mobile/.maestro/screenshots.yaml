# Captures the store screenshots. Run it through `fastlane ios screenshots`
# or `fastlane android screenshots`, which build the app, set MAESTRO_APP_ID,
# MAESTRO_REVIEW_EMAIL and MAESTRO_REVIEW_OTP, and file the images for upload.
# Each takeScreenshot name is the image's file name, and sets its store order.
appId: ${MAESTRO_APP_ID}
name: Store screenshots
---
# clearState keeps the iOS Keychain, where the app stores the session.
- runFlow:
    when:
      platform: iOS
    commands:
      - clearKeychain
- launchApp:
    clearState: true
    permissions:
      all: allow

# Welcome. A tap during launch can have no effect, so the tap is tried again
# until the screen changes.
- extendedWaitUntil:
    visible: "Get Started"
    timeout: 30000
- tapOn:
    text: "Get Started"
    retryTapIfNoChange: true

- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 15000
- tapOn:
    id: "email-input"
- inputText: ${MAESTRO_REVIEW_EMAIL}
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Enter code"
    timeout: 15000
# The code field is focused when the screen opens.
- inputText: ${MAESTRO_REVIEW_OTP}
- tapOn: "Continue"

# The review account has a profile, so the notification step comes next. Every
# permission is granted above, so a system prompt shows only where the
# simulator can't pre-grant one.
- extendedWaitUntil:
    visible: "Know when friends react"
    timeout: 30000
- tapOn: "Continue"
- tapOn:
    text: "Allow"
    optional: true

- extendedWaitUntil:
    visible:
      id: "routine-card"
    timeout: 30000
- tapOn:
    id: "routine-card"
    index: 0
- tapOn: "Start Workout"
- extendedWaitUntil:
    visible: "Mark set 1 done"
    timeout: 15000
# A done button changes its label, so index 0 is always the first exercise.
- tapOn:
    text: "Mark set 1 done"
    index: 0
- tapOn:
    text: "Mark set 2 done"
    index: 0
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: 01-workout
# Discard, so the review account doesn't gain a workout on every capture.
- scrollUntilVisible:
    element: "Discard"
    direction: DOWN
- tapOn: "Discard"
# The alert's confirm button has the same label as the button that opens it,
# and Maestro orders matches top to bottom, so index 0 is the alert's.
- extendedWaitUntil:
    visible: "Discard workout\\?"
    timeout: 5000
- tapOn:
    text: "Discard"
    index: 0

- tapOn: "History"
- extendedWaitUntil:
    visible:
      id: "workout-card"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: 02-history

- tapOn:
    id: "workout-card"
    index: 0
- extendedWaitUntil:
    visible: "Volume"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: 03-workout-details

# A relaunch goes back to the tabs on every platform.
- stopApp
- launchApp
- tapOn: "Exercises"
# Android shows the search bar as a button, and the field gets focus when it opens.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "Search"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Search exercises"
- inputText: "bench press barbell"
- tapOn: "Bench Press \\(Barbell\\), Chest.*"
- extendedWaitUntil:
    visible: "Max Weight"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: 04-exercise

- stopApp
- launchApp
- tapOn: "Friends"
- extendedWaitUntil:
    visible: "(Give|Remove) kudos"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: 05-friends
